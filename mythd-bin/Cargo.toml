[package]
name = "mythd-bin"
description = "mythd — secure inference daemon (entry point)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

build = "build.rs"

[[bin]]
name = "mythd"
path = "src/main.rs"

[features]
# Enables the llama.cpp/SYCL inference engine (BitNet INT2 on Xe2).
llama-cpp = ["mythd-session/llama-cpp"]
# Enables post-quantum TLS (rustls + X25519MLKEM768). Gated so the base daemon
# builds without the aws-lc-rs toolchain.
pq-tls = ["dep:axum-server", "dep:rustls", "dep:rustls-post-quantum", "dep:rustls-pemfile"]

[dependencies]
mythd-core.workspace = true
mythd-xpu.workspace = true
mythd-inference.workspace = true
mythd-session.workspace = true
mythd-api.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true

# Post-quantum TLS (optional; behind the `pq-tls` feature).
axum-server = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-post-quantum = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }

# Integration-test client (examples/integration_client.rs).
[dev-dependencies]
reqwest = { workspace = true, features = ["rustls-tls"] }
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
rustls.workspace = true
rustls-post-quantum.workspace = true
